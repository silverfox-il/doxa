name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Validate queue
        run: doxa validate

      - name: Test
        run: pytest -q

      - name: Upload renderer diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: tests/_out/
          if-no-files-found: ignore
