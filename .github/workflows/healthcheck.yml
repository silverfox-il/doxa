name: healthcheck

# Verifies the Instagram token and account. Prints only username, user_id and
# today's publishing quota; fails if the account is not @the_silver_fox_men or
# IG_USER_ID does not match the token.

on:
  workflow_dispatch:
  # Daily at 06:30 UTC (08:30/09:30 Israel), before the morning posts: a dead
  # token is caught and reported before anything is due.
  schedule:
    - cron: "30 6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Check
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          set -o pipefail
          doxa check --expect-username the_silver_fox_men 2>&1 | tee check.log

      - name: Stats
        # Likes, comments and views are public numbers; never fail the healthcheck on them.
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          doxa stats | tee -a "$GITHUB_STEP_SUMMARY" | tee stats.log
          echo "--- best reels (boost candidates) ---"
          doxa best-reels --top 25 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Follower milestone
        # Owner's next goal is 200 followers; at 200 the book may get soft caption
        # mentions (config/rules.yaml still blocks the word until someone lifts it).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          followers="$(sed -n 's/^followers: \([0-9]*\).*/\1/p' stats.log)"
          title="🎯 200 followers reached"
          if [ "${followers:-0}" -ge 200 ] && [ -z "$(gh issue list --state all --search "in:title \"$title\"" --json number -q '.[0].number')" ]; then
            gh issue create --title "$title" --body "@the_silver_fox_men has ${followers} followers. Lift the book block in config/rules.yaml (soft caption mentions only, no sale link)."
          fi

      - name: Alert the owner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: doxa alert --step healthcheck --log-file check.log
