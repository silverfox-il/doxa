name: approve

# Owner adds the "approved" label to an "Approve: <id>" issue -> write
# `approved: true` into queue/<id>/post.yaml and refresh the issue.

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

# Shared with render.yml: one writer to queue/ at a time.
concurrency:
  group: doxa-queue
  cancel-in-progress: false

jobs:
  sync:
    if: "github.event.label.name == 'approved' && startsWith(github.event.issue.title, 'Approve: ')"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Copy label into post.yaml
        env:
          GH_TOKEN: ${{ github.token }}
          # Untrusted text: only ever passed as an argument, never interpolated.
          TITLE: ${{ github.event.issue.title }}
        run: doxa approve-sync --from-issue-title "$TITLE"

      - name: Commit and refresh the issue
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          id="${TITLE#Approve: }"
          doxa status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue STATUS.md
          if git diff --cached --quiet; then
            echo "already approved"
            exit 0
          fi
          git commit -m "approve: $id via issue label"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          doxa open-issues --sha "$(git rev-parse HEAD)" "$id"
