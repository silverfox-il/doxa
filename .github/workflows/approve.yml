name: approve

# Owner adds the "approved" label to "Approve: <id>" issues -> write
# `approved: true` into queue/<id>/post.yaml and refresh the issues.
#
# Every run syncs ALL labeled issues, not only the one that fired it. Bulk
# labeling fires many runs at once and the shared concurrency group drops the
# pending ones, so a per-issue sync would silently miss approvals.
# workflow_dispatch lets the owner (or a scheduled check) re-run the full sync.

on:
  issues:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Shared with render.yml: one writer to queue/ at a time.
concurrency:
  group: doxa-queue
  cancel-in-progress: false

jobs:
  sync:
    if: "github.event_name == 'workflow_dispatch' || (github.event.label.name == 'approved' && startsWith(github.event.issue.title, 'Approve: '))"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Copy every approved label into post.yaml
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          doxa approve-sync | tee sync.log
          ids="$(sed -n 's/^✓ \([^:]*\): approved via label$/\1/p' sync.log | xargs)"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Commit and refresh the issues
        if: steps.sync.outputs.ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.sync.outputs.ids }}
        run: |
          doxa status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d queue ]; then git add -A queue; fi
          git add STATUS.md
          if git diff --cached --quiet; then
            echo "already approved"
            exit 0
          fi
          git commit -m "approve: $IDS via issue label"
          git pull --rebase --quiet origin main
          git push origin HEAD:main
          # $IDS is intentionally unquoted: one argument per post id.
          doxa open-issues --sha "$(git rev-parse HEAD)" $IDS
