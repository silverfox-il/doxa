name: render

# Owner pushes a post under queue/ -> render its slides (or validate prebuilt
# JPEGs), commit them, then open/refresh the "Approve: <id>" issue.

on:
  push:
    branches: [main]
    paths: ["queue/**"]
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post id to (re)render. Empty = every queued/rendered post."
        required: false
        default: ""

permissions:
  contents: write
  issues: write

# Shared with approve.yml: one writer to queue/ at a time.
concurrency:
  group: doxa-queue
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Book (verbatim checks), music (reels) and identity rules. Needs GH_PAT
      # with read access to silverfox-il/doxa-private. If it is missing,
      # carousels still render, but reels fail and nothing is auto-approved.
      - name: Check out private material
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          repository: silverfox-il/doxa-private
          token: ${{ secrets.GH_PAT }}
          path: private

      - name: Warn if private material is missing
        if: hashFiles('private/book/*.md') == ''
        run: echo "::warning::silverfox-il/doxa-private not checked out. GH_PAT needs Contents read access to it. Reels cannot render and nothing is auto-approved."

      - name: Install
        run: |
          pip install -e .
          python -m playwright install --with-deps chromium
          command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
          # Reels may carry an emoji (e.g. "👏"); Heebo has none, so install a color emoji font.
          sudo apt-get install -y -q fonts-noto-color-emoji

      - name: Pick posts
        id: pick
        env:
          BEFORE: ${{ github.event.before }}
          INPUT_POST_ID: ${{ inputs.post_id }}
        run: |
          if [ -n "$INPUT_POST_ID" ]; then
            ids="$INPUT_POST_ID"
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ids="$(doxa changed 0000000000000000000000000000000000000000 HEAD | xargs)"
          else
            ids="$(doxa changed "$BEFORE" "$GITHUB_SHA" | xargs)"
          fi
          echo "posts: ${ids:-none}"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"

      - name: Validate queue
        run: doxa validate

      - name: Render
        if: steps.pick.outputs.ids != ''
        env:
          IDS: ${{ steps.pick.outputs.ids }}
        # $IDS is intentionally unquoted: one argument per post id.
        run: |
          set -o pipefail
          doxa render $IDS 2>&1 | tee render.log

      # Runs even when Render failed for some posts: the others are kept.
      - name: Commit slides and STATUS.md
        id: commit
        if: always() && steps.pick.outputs.ids != ''
        env:
          IDS: ${{ steps.pick.outputs.ids }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # queue/ can vanish when the last post is deleted; add it only if present.
          # STATUS.md is left to the publisher: publish runs rewrite it every 30
          # minutes, and committing it here only caused rebase conflicts.
          if [ -d queue ]; then git add -A queue; fi
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "render: $IDS"
            git pull --rebase --autostash --quiet origin main
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Owner switch: repo variable DOXA_AUTO_APPROVE=true. Only posts with zero
      # rule findings qualify; they still wait 24 h and obey the `hold` label.
      - name: Auto-approve
        id: auto
        if: always() && steps.pick.outputs.ids != '' && vars.DOXA_AUTO_APPROVE == 'true'
        env:
          IDS: ${{ steps.pick.outputs.ids }}
        run: |
          if [ ! -d private/book ]; then
            echo "private repo not checked out: skipping auto-approve"
            exit 0
          fi
          doxa auto-approve $IDS
          if [ -d queue ]; then git add -A queue; fi
          if ! git diff --cached --quiet; then
            git commit -m "auto-approve: $IDS"
            git pull --rebase --autostash --quiet origin main
            git push origin HEAD:main
          fi

      - name: Open or refresh approval issues
        if: always() && steps.pick.outputs.ids != ''
        env:
          GH_TOKEN: ${{ github.token }}
          IDS: ${{ steps.pick.outputs.ids }}
        run: DOXA_SHA="$(git rev-parse HEAD)" doxa open-issues $IDS

      - name: Alert the owner
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: doxa alert --step render --log-file render.log
