  - אתה מסכים לדברים שלא מתאימים לך, מנסה להרשים במקום להיות אתה, ומעלים עין מדברים שמפריעים לך. למה? כי אתה מפחד שאם תהיה אתה באמת, היא לא תרצה אותך.
  - אבל יש כאן שאלה שאתה חייב לשאול את עצמך.
  - נניח שהצלחת. היא רוצה אותך. היא מתלהבת ממך. היא רוצה להיפגש שוב. אבל בדרך לשם כל כך התאמצת להיות הגבר שהיא רוצה, ששכחת לבדוק אם אתה בכלל רוצה אותה. אז מי בדיוק בחר במי?
  - 'תפסיק לשאול רק: איך אני גורם לה לרצות אותי?'
  - 'תתחיל לשאול גם: האם נעים לי איתה? האם אני יכול להיות עצמי לידה? האם אני אוהב את מה שאני מגלה עליה? האם אני באמת מעוניין בה, או שאני פשוט נהנה מזה שהיא מעוניינת בי? אלה לא שאלות של גבר שחושש להפסיד. אלה שאלות של גבר שיודע שגם הזמן והלב שלו שווים משהו.'
  - אתה לא מגיע לדייט כדי להתקבל לעבודה.
  - אתה מגיע להכיר אישה. יכול להיות שהיא תמצא חן בעיניך ואתה לא בעיניה. יכול להיות שהיא תרצה אותך ואתה תבין שזה לא מתאים. ולפעמים תהיה משיכה, אבל לא תהיה התאמה. זה לא כישלון. זאת בדיוק הסיבה שיוצאים לדייטים. אתה לא צריך לשכנע כל אישה שאתה רוצה שאתה הגבר הנכון בשבילה.
  - תפסיק לחכות לציון עובר.
  - 'אתה לא עובר מבחן. אתה עורך מבחן. בפעם הבאה שאתה יושב מול אישה שמוצאת חן בעיניך, תזכור דבר אחד: אל תתעסק רק בשאלה אם היא רוצה אותך. תבדוק גם אם אתה רוצה אותה. שמור את הפוסט הזה לפעם הבאה שאתה יוצא לדייט ושוכח את זה.'
  - אחרי שנים בזוגיות, קל לשכוח איך זה מרגיש להתחיל מחדש.
  - ופתאום, כשמישהי מוצאת חן בעיניך, אתה עלול לתת לה את כל הכוח עוד לפני שאתה באמת מכיר אותה.
  - כל הודעה שלה הופכת לסימן. כל שתיקה הופכת לחשש. וכל דבר קטן שאתה לא בטוח לגביו גורם לך לחשוב שאולי אתה צריך להשתנות כדי שהיא תרצה אותך.
  - אבל יש הבדל בין להשקיע בקשר לבין לנסות לקנות את המקום שלך בו.
  - אתה לא צריך שכל אישה שאתה רוצה תבחר בך. אתה צריך ללמוד לבחור נכון את האישה שאתה מכניס לחיים שלך.
  - בפעם הבאה שאתה יוצא לדייט, אל תשאל רק אם מצאת חן בעיניה.
  - 'תשאל גם את עצמך: האם מצא חן בעיניי מה שראיתי?'
