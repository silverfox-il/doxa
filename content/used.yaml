  - בסבב השני, מערכת יחסים היא בחירה. לא הצלה.
  - 'אז קודם תמלא את החיים שלך: חברים, ספורט, עבודה שאתה גאה בה, והבית שלך, גם אם הוא קטן.'
  - כשהחיים שלך מלאים, היא תוספת טובה. לא אוויר לנשימה.
