# Content rules checked by doxa/rules.py before any post is approved or published.
# Identity terms (the owner's real name, city, job) are NOT here: they live in
# rules_private.yaml in the private repo, so this public file reveals nothing.

# block: the post can never publish while one of these appears.
block_words:
  # No hint of a book, an edition, or a sale before 500 followers.
  # "book(s)" with the prefixes ה ב ו ש; "מספר"/"לספר" (number, to tell) stay legal.
  - "re:(?<![א-ת])[והבש]{0,3}ספר(?:ים)?(?![א-ת])"
  - מהדורה
  - מהדורת
  - הגרסה הישנה
  - גרסה ישנה
  - מכירה
  - למכור
  - השקה
  - הנחה
  - קופון
  - קורס
  - לינק בביו
  - link in bio
  - ₪
  # Never "fire your boss".
  - בוס
  - תפטר
  - להתפטר
  - לפטר
  # Word list from the owner: use "בילבל" or "החבר שם למטה" instead.
  - זרג

# review: allowed in the book, but a human must look before it goes out
# (auto-approve skips posts that hit any of these).
review_words:
  # Positions the account must not contradict (no restaurant first date, etc.).
  - מסעדה
  - מסעדות
  - ויברטור
  - ירידה
  # Explicit sex: risky under Instagram's rules (crude words: see masked_words).
  - חדירה
  # Consent is a red line.
  - שיכורה
  - בכוח
  # Women as a group, slurs.
  - כל הנשים
  - כלבה
  - פרחה
  # Ethnic stereotypes.
  - ערבייה
  - ערביה
  - רוסייה
  - רוסיות
  - אתיופית
  - מרוקאית
  - פרסייה
  - ערס

blocked_hashtags:
  - ספר
  - הספר

# The only line allowed to contain a dash.
signature: "אתה צריך להיות הסיבה – לא האפקט"

# Audience is 45+: a 45 year old dates women from 37, a 50 year old from 42.
min_woman_age: 37

# Content engine (hook, call to action, pillar) binds posts from this time on.
engine_from: "2026-10-04 00:00"
# Slide 1 / reel line 1 is the hook: one punchy line the viewer reads first.
hook_min_words: 3
hook_max_words: 18  # book-quote hooks the owner approved run to 16 words

# Owner's rule (2026-10-03): posts are written in the book's voice (its insights,
# conclusions, slang, bluntness and attitude), not copied word for word.
require_verbatim: false

# Crude words keep the voice but are masked so Instagram does not restrict the
# account. The raw word blocks the post; write the masked form instead.
# "re:" entries are regexes: they skip innocent look-alikes such as
# "מזונות" (alimony) or "מזין" (nourishing).
masked_words:
  - match: "re:(?<![א-ת])[והבלש]{0,2}זונ(?:ה|ות)(?![א-ת])"
    write: "Zונה / Zונות"
  - match: "re:זדיינ|זדיין"
    write: "עושה את המעשה"
  - match: "re:(?<![א-ת])[והלש]{0,2}(?:לזיין|יזיין|תזיין|זיינתי|זיינה|זיינו)(?![א-ת])"
    write: "לעשות את המעשה"
  - match: "re:(?<![א-ת])[והבלש]{0,2}זיונ(?:ים)?(?![א-ת])|(?<![א-ת])[והבלש]{0,2}זיון(?![א-ת])"
    write: "המעשה"
  - match: "re:(?<![א-ת])[והבל]?זין(?![א-ת])"
    write: "Zין"
  - match: "re:(?<![א-ת])[והבלש]{0,2}סקס(?![א-ת])"
    write: "Sקס"
  - match: "re:(?<![א-ת])[והבלש]{0,2}אורגזמ(?:ה|ות)(?![א-ת])"
    write: "אורגZמה"
  - match: "re:(?<![א-ת])[והבלש]{0,2}שרמוט(?:ה|ות)(?![א-ת])"
    write: "שרמו*ה"
  - match: "re:(?<![א-ת])[והבלש]{0,2}כוסי(?:ת|ות)(?![א-ת])"
    write: "Kוסית"

# The book's voice (owner, 2026-10-03): talk TO the reader in second person,
# "אם אתה ... אז ...", "אם אתה עד כדי כך דפוק ש...", never preach ABOUT "a man who".
# Plus Hebrew mistakes the owner caught. Checked on posts not yet published.
style_rules:
  # (2026-10-08) The '^גבר' rule was removed: posts now quote the owner's new book,
  # which talks about men in the third person.
  - match: "re:להיות נדלק"
    write: "write 'להידלק' (היא צריכה להידלק ממך)"

# Owner's decision (2026-10-04): the daily teaser series (a reel with stories)
# may make cynical generalizations about women, like the owner's example reel.
# Only these review words are lifted there; slurs and everything else still apply.
tease_allowed_review:
  - כל הנשים
