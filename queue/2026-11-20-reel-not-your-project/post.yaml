  stories:
  - יש נשים שהחיים שלהן מנוהלים על ידי חומר או הרגל שהן כבר לא שולטות בו. הבקבוק שנפתח כל ערב ונגמר עד הסוף.
  - האפליקציה של ההימורים בטלפון. החבילות שמגיעות מסין שלוש פעמים בשבוע והכרטיס שכבר מזמן ביתרת חובה.
  - הרגל הופך לבעיה ברגע שהוא מתחיל לגבות מחיר מהחיים שלה ומהחיים שלך.
  - לקנות נעליים חדשות זה לא סיפור. להסתיר ממך חשבוניות ולבקש "הלוואה קטנה עד סוף החודש", כבר כן.
  - 'ופה יש מלכודת. אתה רואה אישה חמודה, קצת שבורה, והאינסטינקט אומר לך: אני אעזור לה, אני אהיה העוגן.'
  - אחי, ההתמכרות שלה היא לא הפרויקט שלך. אתה לא המטפל שלה, לא הבנק שלה ולא השוטר שלה.
  - אם היא יודעת שיש לה בעיה ונמצאת בטיפול אמיתי, זה שווה הערכה. אבל גם אז אתה לא קופץ לתוך קשר רציני.
