  - היא רצתה לדעת אם יש לך עמוד שדרה, אם אתה נבהל מהערה עוקצנית, אם אתה רודף אחריה כשהיא לא עונה יומיים.
  - עברת את זה, יצאתם, שכבתם, טוב לכם. עכשיו מתחלף התפקיד.
  - לא אם שווה לשכב איתה, את זה כבר הבנת, אלא אם שווה לתת לה מקום אמיתי בחיים שלך, בבית שלך, ליד הילדים שלך.
  - רוב הגברים מדלגים על השלב הזה. בתוך חודש הם נותנים לה מפתח, בתוך חודשיים היא כבר פוגשת את הילדים,
  - ובתוך חצי שנה הם שוב מוצאים את עצמם במקום שהם נשבעו לא לחזור אליו.
  - אתה בודק אם המילה שלך שווה משהו, אם אתה מחזיק את הקו שהצבת בהתחלה, או שאתה מתקפל ברגע שנהיה נוח.
  - אם אתה צף, היא תצוף. אם אתה עקבי, רוב הנשים הטובות יתחברו לעקביות הזו ויישארו בה.
