  lines:
  - לפני עשר שנים המשחק ברשת היה פשוט יחסית.
  - מי שהיו לו הכי הרבה עוקבים, הכי הרבה לייקים והתמונה הכי מרשימה ליד רכב שהוא לא בטוח שלו, ניצח.
  - גברים קנו עוקבים, צילמו את עצמם ליד פרארי שכורה בשוק האיכרים של מונקו (או בחניון של הקניון) ובנו חלון ראווה של סטטוס מזויף.
  - היום כל החרא הזה נגמר, ובגילך הוא נגמר פעמיים.
  - מה שפעם היה מרשים (תמונות מושלמות, חיים מושלמים, יאכטה) היום מדליק אצלה נורה אדומה.
  stories:
  - המספר ליד השם שלך, שפעם היה כרטיס כניסה, הוא היום בערך כמו מספר הקילומטרים של הרכב, אף אחת לא בוחרת גבר בגללו.
  - היא לא מחפשת עוד "וואו", היא מחפשת "אפשר לסמוך עליו".
