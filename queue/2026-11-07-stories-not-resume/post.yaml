  title: כשהיא שואלת מה אתה עושה, היא לא רוצה לשמוע את התואר שלך, את שם החברה ואת מספר העובדים שמתחתיך (אם אתה מתחיל לספור לה עובדים, שיט, כבר הפסדת)
