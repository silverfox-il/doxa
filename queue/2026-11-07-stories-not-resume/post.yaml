  layout: bottom
- title: כשהיא שואלת מה אתה עושה, היא לא רוצה לשמוע את התואר שלך, את שם החברה ואת מספר העובדים שמתחתיך (אם אתה מתחיל לספור לה עובדים, שיט, כבר הפסדת)
  layout: bottom
- title: '"אני האיש שמתקשרים אליו כשמשאית תקועה בנמל בשתיים בלילה. זה פחות זוהר ממה שזה נשמע, אבל אני טוב בזה ואני ישן מצוין כשזה נפתר".'
  layout: bottom
- title: '"התגרשנו לפני ארבע שנים, זה היה נכון לשנינו, והיום אנחנו מסתדרים יפה בשביל הילדים" היא תשובה מושלמת, גם אם בפנים זה עדיין קצת כואב'
  layout: bottom
- title: כן, גברים משקרים גם על הגובה, ואז מגיעים לבית הקפה ומגלים שהיא הגיעה בנעליים שטוחות במיוחד בשבילם
  layout: bottom
- title: אם שיקרת על דבר קטן, היא תניח שאתה משקר גם על הדברים הגדולים.
