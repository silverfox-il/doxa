  kicker: ''
  title: '"אני האיש שמתקשרים אליו כשמשאית תקועה בנמל בשתיים בלילה. זה פחות זוהר ממה שזה נשמע, אבל אני טוב בזה ואני ישן מצוין כשזה נפתר".'
  accent: ''
  body: ''
  layout: bottom
  items: []
- background: null
  kicker: ''
  title: '"התגרשנו לפני ארבע שנים, זה היה נכון לשנינו, והיום אנחנו מסתדרים יפה בשביל הילדים" היא תשובה מושלמת, גם אם בפנים זה עדיין קצת כואב'
  accent: ''
  body: ''
  layout: bottom
  items: []
