  stories:
  - היא הסתכלה פעמיים, היא צחקה, ומשהו התחיל לזוז אצלה בעיניים. ועכשיו, דווקא עכשיו, רוב הגברים בגילך עושים את הטעות הכי מעצבנת שיש.
  - הם נהיים רציניים. פתאום הם מרגישים שהגיע הזמן "להציג את עצמם כמו שצריך", ומתחילים לפרוש קורות חיים.
  - 'השלב הזה לא נועד לשכנע אותה בכלום. הוא נועד לדבר אחד בלבד: שיהיה לשניכם טוב ביחד, עכשיו, ברגע הזה.'
  - אתם מדברים כמה דקות, זורם, נעים, ואז אתה זורק משהו קטן עם עוקץ. ואז שוב שיחה רגילה. ושוב עוקץ קטן. ככה, בגלים.
  - גברים ונשים לא נדלקים באותה מהירות. אנחנו רואים אישה ויודעים תוך שנייה אם בא לנו עליה, כמו מתג של אור במסדרון.
  - 'אצל רוב הנשים זה עובד יותר כמו תנור ישן: לוקח לו זמן להתחמם, אבל כשהוא חם, הוא שומר על החום הרבה יותר זמן.'
  - היא לא מכונת משקאות שאתה מכניס מטבע ויוצאת פחית. גבר שכל הזמן חושב על היעד נהיה לחוץ, והלחץ דולף החוצה.
