  - שמונה דייטים. מסעדות, יין, שיחות עד אחת בלילה. היא בכתה לך על האקס, על אמא, על המנהל המניאק.
  - ובסוף כל ערב קיבלת חיבוק. כמו שמחבקים דוד בבר מצווה.
  - ובאותו שבוע היא פתחה רגליים לזרנוק מטינדר, שעתיים אחרי ה"היי" הראשון. בלי מסעדה, בלי יין, בלי שיחה.
  - ככה זה עובד, אחי. הוא קיבל את הגוף שלה. אתה קיבלת את הבעיות שלה. ואת החשבון.
  - ואם עוד בדייט הראשון אין אפילו נשיקה, זה ממש לא "היא אשה של פעם...".
  - אתה לא הגבר שלה. אתה הטמפון הרגשי שלה, עם כרטיס אשראי.
