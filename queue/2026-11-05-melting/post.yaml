caption: |-
  הרבה גברים בנישואים ארוכים פשוט נמסים.
  זה קורה לאט, בלי שאף אחד מתכוון לזה. ערב עם החבר'ה, חדר הכושר, התחביב, הדעה שלך. אחרי גירושים, זה הדבר הראשון שאתה מחזיר לעצמך.

  שמור את הפוסט. תחזור אליו כשתצטרך.
