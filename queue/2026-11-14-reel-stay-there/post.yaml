  - '"למה אתה צריך לקום בשש לחדר כושר, תישאר איתי במיטה."'
  - אם תוותר על מה שהביא אותך לשם, לא תישאר שם.
  music: vaitsez-dark-dark-trap-beat-595789.mp3
  per_line: 3.5
  hold: 7.0
  stories:
  - החיים שלך, המטרה שלך, מה שאתה בונה, צריכים להישאר במרכז. גם כשיש אישה. במיוחד כשיש אישה.
  - אישה רוצה להיות חלק מהחיים של גבר, לא המרכז שלהם. היא רוצה להצטרף למסע של מישהו שהולך לאנשהו.
  - גבר שכל עולמו מסתובב סביבה, שמחכה לה, שמבטל הכל בשבילה, הוא אולי נוח לה לחודשיים, אבל אחר כך היא מתחילה להסתכל עליו כמו על רהיט.
  - '"תבטל את הפגישה ההיא, בוא נצא לארוחה." "סע עם החבר''ה לצפון בפעם אחרת, בוא נהיה יחד בשבת."'
  - כל אחת מהבקשות האלה בנפרד נשמעת תמימה. הבעיה מתחילה כשזה נהיה דפוס, ולאט לאט כל מה שהיה שלך נעלם.
  - 'מה שהרבה נשים לא יגידו לך בקול: הן מקוות שלא תוותר.'
  - כשאתה קם בשש בכל זאת, מנשק אותה ויוצא לאימון, משהו בה נרגע. היא יודעת שהגבר שלה עדיין הגבר שהיא בחרה.
  - אתה מקדיש לה זמן, אתה נהנה איתה, אתה נוכח כשאתם יחד. אבל אתה לא בונה את החיים שלך מסביב ללוח הזמנים שלה.
