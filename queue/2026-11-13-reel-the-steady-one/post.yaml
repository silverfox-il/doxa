  stories:
  - לרוב הנשים שתפגוש יש אקס, ולהרבה מהן יש איתו ילדים. אז השאלה היא לא אם יש קשר. השאלה היא איזה קשר.
  - 'יש קשר לוגיסטי, קר, ענייני: מי לוקח את הילדים בסופ"ש, מי משלם על החוג, מי מדבר עם המורה. זה נורמלי, זה בריא.'
  - ויש קשר רגשי. היא מתקשרת אליו כשהיא עצובה. הוא הראשון שהיא מספרת לו על ההצלחה בעבודה.
  - 'היא עוד מדברת עליו כל הזמן, אם בגעגוע ואם בזעם, וזה לא משנה, כי שניהם אומרים את אותו דבר: הוא עוד לא יצא לה מהראש.'
  - גבר יכול לתת לה עשר שנים של יציבות, ארוחות שישי ונסיעות לאילת, וגבר אחר יכול לתת לה שלושה חודשים של אש, ושלושת החודשים ינצחו.
  - אם זה המצב, אתה לא תהיה הבחירה הראשונה שלה. אתה תהיה הפשרה. המקום הבטוח שאליו היא נחתה אחרי שהסערה נגמרה.
  - 'אתה אומר, פעם אחת, ברור, מה הסטנדרט שלך: "אני בזוגיות אקסקלוסיבית. אני לא מחזיק נשים ברזרבה, ואני מצפה לאותו דבר".'
  - ואז אתה מסתכל על ההתנהגות. אם היא ממשיכה לשמור על כל הדלתות פתוחות, זו לא אישה לזוגיות רצינית.
