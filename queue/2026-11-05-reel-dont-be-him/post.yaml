  - אני לא מבין איך גברים שמשחקים אותה גברים אמיתיים מכירים נשים ונותנים להן זוגיות מההתחלה,
  - שופכים עליהן כספים, מאמינים בהן ובוטחים בהן וסומכים עליהן...
  - אל תהיה הגבר הזה.
  music: apalonbeats-dark-trap-540578.mp3
