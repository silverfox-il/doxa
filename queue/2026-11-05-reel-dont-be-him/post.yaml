  stories:
  - תכיר את זה, כי זה יקרה לך כבר מההודעה הראשונה. אתה כותב משהו, והיא עונה בתגובה שהיא לא "כן" ולא "לא".
  - '"אתה כותב ככה לכל אחת?". "נראה לי שאתה שחקן". "אתה תמיד כזה בטוח בעצמך?". זה לא דחייה ולא הסכמה. זה מבחן.'
  - למה היא עושה את זה? כי היא לא יכולה לדעת מה אתה שווה באמת. פרופיל, תמונות, קול, את כל זה אפשר לזייף.
  - וכל אישה בגילך כבר ראתה איך גבר שנראה מבחוץ כמו סלע מתגלה אחרי שנה כמו ג'לי.
  - היא התחתנה עם גבר שנראה לה חזק ובטוח, וגילתה עם השנים שכל פעם שהיא לחצה עליו, הוא התקפל, נעלב, התווכח כמו ילד או ברח לטלפון.
  - היא לא מתכוונת לעשות את הטעות הזו פעמיים. אז היא לוחצת קצת, רואה אם אתה נסדק, ולפי זה מחליטה.
  - בחורה צעירה בודקת אותך כמו חובבנית. אישה בגילך בודקת אותך כמו מבקרת המדינה.
  - לא הוגן? אתה צודק. אבל המשחק לא מתעניין בהוגנות שלך. מי שמבין את זה מפסיק להתבאס ומתחיל לנצח.
