  - היא התאהבה בגבר שהגיע לדייט רגוע, בכושר, עם חיים מלאים וסיפורים טובים,
  - ומה שיש לה עכשיו זה שותף לדירה שמתלונן על הגב ושואל אותה מה לעשות בשבת.
  - תכל'ס, היא לא השתנתה. הוא השתנה.
