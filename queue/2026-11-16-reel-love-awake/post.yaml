  stories:
  - אין שום בעיה לאהוב אישה. אתה יכול לאהוב את החום שלה, את הצחוק שלה, את הדרך שבה היא מחזיקה לך את הגב כשקשה.
  - זה אמיתי, זה בנוי על מה שהיא עושה בפועל, וזה גדל לאט, ככל שהיא מוכיחה את עצמה.
  - להיות מאוהב זה סיפור אחר. זו פנטזיה שבנית לך בראש, דמות שאתה מלביש על אישה אמיתית.
  - כשאתה אוהב, אתה ער. אתה רואה מה היא נותנת, ואם היא מפסיקה לתת, גם הרגש שלך נרגע.
  - כשאתה מאוהב, אתה עיוור. היא יכולה להבריז לך פעמיים, לענות לך אחרי יומיים, להשאיר אותך על "אולי", ואתה עדיין מוצא לה תירוצים.
  - זה קראש של תיכון, רק עם שיער לבן.
