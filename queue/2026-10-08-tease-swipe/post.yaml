  - אני יודע שאתה מותקן על שלוש אפליקציות ומחליק בלילות כמו זומבי.
  - מחליק ימינה על כל מה שזז.
  - שולח לכל מאצ' "היי מה נשמע".
  - מחכה שלושה ימים לתשובה,
  - ואז מתלונן שהנשים שם רק מחפשות תשומת לב.
  - ברור שהן מחפשות. זה מה שאתה נותן להן מבוקר ועד לילה.
