  lines:
  - אני רואה אותם כל יום, גברים בני 45 עד 60 שבטוחים שהם עושים עבודה טובה ברשת.
  - כל הפיד שלו זה ברכות לראש השנה ו"בוקר טוב לכולם". הוא בטוח שהוא נחמד וחם, והיא רואה סבא.
  - הוא כותב "מהממת" על כל סלפי ושולח לב אדום על כל סטורי. כל הנשים ברשימה שלו כבר השתיקו אותו מזמן.
  - תמונת הפרופיל שלו מלפני שתים עשרה שנה, מהחתונה של אח שלו, כשהיה לו עוד שיער ועוד לא הייתה לו כרס.
  - כל התמונות שלו מהמושב של הנהג, עם חגורת הבטיחות על החזה. והיא רואה גבר שאין לו אף אחד שיצלם אותו.
