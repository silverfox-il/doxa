  - בהתחלה היא שלחה לך "בוקר טוב מאמי" עם שלושה לבבות, וסיפרה לך כל שטות מהיום שלה.
  - עכשיו? "סבבה". "חח". "נדבר". ו"לילה טוב אהוב שלי" נעלם כאילו לא היה.
  - והיא בטוחה שאתה לא שם לב. אתה שם לב. ומה אתה עושה? שולח פרחים, מצחיק, מציע צימר בצפון.
  - אחי, אישה לא מתקררת כי חסרים לה פרחים. היא מתקררת כי מישהו אחר כבר מחמם לה את הדמיון.
  - וכל ניסיון שלך להתלקק רק מוכיח לה שהיא צדקה כשהחליטה לשחרר אותך.
  - אז אתה לא רודף. אתה מפסיק לכתוב, מעביר את הצ'אט לארכיון, ונותן לה לגלות לבד איך נשמע השקט של גבר שלא סופר אותה ממטר.
