  stories:
  - הגוף הוא מכונה חסכונית. הוא נותן לך את מה שהחיים שלך דורשים ממנו, לא יותר.
  - אם כל היום שלך זה משרד, רכב, ספה ונטפליקס, הגוף לא מבין למה לבזבז משאבים על דלק של לוחם.
  - וכשהחיים שלך מלאים באתגרים, במטרות, בדברים שאתה נאבק עליהם ורוצה לנצח בהם, משהו בגוף מתעורר.
  - סגרת עסקה קשה או סיימת ריצה שלא האמנת שתסיים, ואתה מסתובב עם אנרגיה אחרת לגמרי, עם גב זקוף, עם מבט שנשים קולטות.
  - אז מה עושים עם זה? מחפשים תחרות. בכוונה.
  - תירשם לליגת כדורגל של ותיקים. תצטרף לקבוצת ריצה. תיכנס לחוג ג'ודו או קרב מגע. תציב לעצמך יעד בעבודה שמפחיד אותך קצת.
  - קבוצת הריצה, החוג, הליגה, כולם מקומות שבהם יש נשים שכבר עומדות מולך, שרואות אותך מזיע, מתאמץ, מצחיק את החבר'ה אחרי אימון.
  - אתה לא צריך לרדוף אחרי אף אחת.
