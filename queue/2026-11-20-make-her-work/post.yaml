  איזה משפט פה תפס אותך? תכתוב בתגובות.
  .
  #גירושין #גרוש #אבאגרוש #הורותמשותפת #אבא #mindset #divorcerecovery #divorceddad #coparenting #singledad #ישראל
slides:
- background: null
  kicker: 4 דרכים
  title: איך נותנים לה להתאמץ, בלי להיות חמור.
  accent: נשים אוהבות להרגיש נחשקות, אבל הן לא בהכרח צריכות לשמוע למה.
  body: ''
  layout: bottom
  items: []
- background: null
  kicker: דרך 1
  title: '"אני לא יודע למה, אבל יש בך משהו. אולי נסתדר. אולי".'
  accent: ''
  body: והיא נשארת לתהות מה זה ה"משהו". גבר שאומר מיד "את כל כך יפה, אני אוהב את החיוך שלך", הרג את כל המתח.
  layout: bottom
  items: []
- background: null
  kicker: דרך 2
  title: למצוא דבר משותף ולהוסיף לו עוקץ.
  accent: ''
  body: '"יופי, גם אני. השאלה היא כמה עמוק את יורדת בסקוואט, כי אני עם אלה שעושים חצי תנועה לא מתאמן".'
  layout: bottom
  items: []
- background: null
  kicker: דרך 3
  title: עזיבה משחקית.
  accent: ''
  body: '"רגע, את אוכלת פיצה עם אננס? זהו, זה לא ילך בינינו. היה נחמד להכיר". ואתה עושה חצי סיבוב כאילו אתה הולך.'
  layout: bottom
  items: []
- background: null
  kicker: ''
  title: ברוב המקרים היא תצחק ותמשוך אותך בשרוול בחזרה.
  accent: ''
  body: הכל בחיוך, בקלילות, בלי שום עלבון אמיתי.
  layout: bottom
  items: []
- background: null
  kicker: דרך 4
  title: המחמאה עם האשמה.
  accent: ''
  body: '"רגע, מה את עושה? אני מתחיל לחבב אותך. זה לא הוגן, אני מכיר אותך עשרים דקות".'
  layout: bottom
  items: []
- background: null
  kicker: ''
  title: '"את נראית מדהים הערב"? היא כבר שמעה את זה ארבע פעמים.'
  accent: ''
  body: היא מקבלת מחמאה, אבל היא לא מקבלת אותה בחינם, ובעיקר היא לא מקבלת את התחושה שאתה כבר שלה.
  layout: bottom
  items: []
