- background: null
  kicker: '1'
  title: '"למה את לא עונה?"'
  accent: ''
  body: וגם "נעלמת?" ו"הכל בסדר איתך?". כל גרסה כזאת אומרת לה שאתה יושב ומחכה.
  layout: bottom
  items: []
- background: null
  kicker: '2'
  title: '"את לא כמו כולן."'
  accent: ''
  body: היא יודעת שאמרת את זה גם לקודמת.
  layout: bottom
  items: []
- background: null
  kicker: '3'
  title: '"אני לא טיפוס של הודעות."'
  accent: ''
  body: ואחריה עשר הודעות.
  layout: bottom
  items: []
- background: null
  kicker: '4'
  title: '"האקסית שלי..."'
  accent: ''
  body: כל משפט שמתחיל ככה הורג את השיחה. היא לא באה לשמוע עליה.
  layout: bottom
  items: []
- background: null
  kicker: '5'
  title: '"תשלחי תמונה."'
  accent: ''
  body: לפני שנפגשתם, בשום ניסוח. זה לא מחמיא. זה קריפי.
  layout: bottom
  items: []
- background: null
  kicker: '6'
  title: '"בוקר טוב יפה"'
  accent: ''
  body: כל בוקר, עם פרח מהאינטרנט. היא רואה סבא.
  layout: bottom
  items: []
- background: null
  kicker: '7'
  title: '"אז מה, אנחנו נפגשים או לא?"'
  accent: ''
  body: היא ביקשה עוד כמה ימים, ואתה לוחץ? הרגע נתת לה סיבה לא לבוא.
  layout: bottom
  items: []
- background: null
  kicker: ''
  title: אלה הודעות של סמרטוט, לא של גבר שיש לו חיים...
