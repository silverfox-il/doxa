  stories:
  - רוב הנשים שתפגוש בגיל הזה הן גרושות, ורובן אמהות. אז השאלה היא לא אם יש לה ילדים. השאלה היא איך היא מנהלת את החבילה שמגיעה איתם.
  - 'הראשון: איך היא מנהלת את האקס. יש גרושות שבנו עם האב של הילדים מערכת עבודה מסודרת, ויש גרושות שכל שבוע שני יש מלחמת עולם.'
  - אתה לא רוצה להיכנס לתוך המלחמה הזו. לא כמתווך, לא כתומך רגשי ולא כמי ש"יסדר לו את הראש".
  - 'השני: מה היא מצפה ממך כלכלית. אין שום בעיה שאתה משלם על דייט, על קפה, על סוף שבוע בצפון.'
  - יש בעיה גדולה כשאחרי חודשיים פתאום אתה מממן חוגים, מזגן לחדר של הבת שלה, ו"רק הפעם" את החשבון של החשמל.
  - 'השלישי: קצב ההכרות עם הילדים. אם היא ממהרת להכניס אותך לבית, היא מחפשת משהו: עזרה, יציבות, "אבא", או פשוט לנעול את העסקה.'
  - 'הרביעי: דרמה סביב המשמורת. מי שמשתמשת בילדים נגד האב של הילדים שלה, תעשה את זה גם לך, יום אחד, במקום אחר.'
