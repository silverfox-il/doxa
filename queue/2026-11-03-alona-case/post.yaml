  kicker: דני של היום
  title: הודעה אחת. קצרה. חמה.
  accent: ''
  body: ואז שבוע רגיל. עבודה, אימון, ערב עם הבן, כדורגל עם החבר'ה ביום חמישי.
  layout: bottom
  items: []
- background: null
  kicker: יום שני
  title: היא כתבה לו.
  accent: ''
  body: '"נו, אתה נרשם לסדנה של השבוע הבא? ומה אתה עושה בשבת? יש לי רעיון."'
  layout: bottom
  items: []
- background: null
  kicker: יום רביעי
  title: שקיעה מהמרפסת.
  accent: ''
  body: '"הייתי צריכה אותך פה עם המצלמה." ובשבת היא הגיעה עם עוגיות שאפתה לבן שלו.'
  layout: bottom
  items: []
