  title: דני, גרוש, הכיר את אלונה בסדנת צילום.
  accent: ''
  body: שני דייטים של קפה ויין. בשלישי היא נשארה אצלו.
  layout: bottom
  items: []
- background: null
  kicker: דני של פעם
  title: בבוקר הודעה ארוכה.
  accent: ''
  body: בצהריים עוד אחת. בערב טלפון, "רק לבדוק שהכל טוב". ככה מבריחים אישה תוך שבוע.
  layout: bottom
  items: []
