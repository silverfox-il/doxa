  title: פתאום כל דבר הופך למבחן.
  accent: ''
  body: |-
    היא לא ענתה שלוש שעות? אתה מתחיל לחשוב מה עשית לא בסדר.
    הדייט היה קצת שקט? אתה משחזר כל משפט שאמרת.
    היא לא קבעה דייט נוסף? אתה מחפש איפה נכשלת.
    בלי לשים לב, הפכת את עצמך למועמד שמחכה לתשובה.
  layout: bottom
  items: []
- background: null
  kicker: ''
  title: וככה אתה מתחיל לאבד את עצמך.
  accent: ''
  body: |-
    אתה מסכים לדברים שלא מתאימים לך, מנסה להרשים במקום להיות אתה, ומעלים עין מדברים שמפריעים לך.
    למה?
    כי אתה מפחד שאם תהיה אתה באמת, היא לא תרצה אותך.
  layout: bottom
  items: []
- background: null
  kicker: ''
  title: אבל יש כאן שאלה שאתה חייב לשאול את עצמך.
  accent: ''
  body: |-
    נניח שהצלחת.
    היא רוצה אותך. היא מתלהבת ממך. היא רוצה להיפגש שוב.
    אבל בדרך לשם כל כך התאמצת להיות הגבר שהיא רוצה, ששכחת לבדוק אם אתה בכלל רוצה אותה.
    אז מי בדיוק בחר במי?
  layout: bottom
  items: []
- background: null
  kicker: ''
  title: 'תפסיק לשאול רק: איך אני גורם לה לרצות אותי?'
  accent: ''
  body: |-
    תתחיל לשאול גם:
    האם נעים לי איתה?
    האם אני יכול להיות עצמי לידה?
    האם אני אוהב את מה שאני מגלה עליה?
    האם אני באמת מעוניין בה, או שאני פשוט נהנה מזה שהיא מעוניינת בי?
    אלה לא שאלות של גבר שחושש להפסיד. אלה שאלות של גבר שיודע שגם הזמן והלב שלו שווים משהו.
  layout: bottom
  items: []
- background: null
  kicker: ''
  title: אתה לא מגיע לדייט כדי להתקבל לעבודה.
  accent: ''
  body: |-
    אתה מגיע להכיר אישה.
    יכול להיות שהיא תמצא חן בעיניך ואתה לא בעיניה. יכול להיות שהיא תרצה אותך ואתה תבין שזה לא מתאים. ולפעמים תהיה משיכה, אבל לא תהיה התאמה.
    זה לא כישלון. זאת בדיוק הסיבה שיוצאים לדייטים.
    אתה לא צריך לשכנע כל אישה שאתה רוצה שאתה הגבר הנכון בשבילה.
  layout: bottom
  items: []
- background: null
  kicker: ''
  title: תפסיק לחכות לציון עובר.
  accent: ''
  body: |-
    אתה לא עובר מבחן. אתה עורך מבחן.
    בפעם הבאה שאתה יושב מול אישה שמוצאת חן בעיניך, תזכור דבר אחד:
    אל תתעסק רק בשאלה אם היא רוצה אותך. תבדוק גם אם אתה רוצה אותה.
    שמור את הפוסט הזה לפעם הבאה שאתה יוצא לדייט ושוכח את זה.
