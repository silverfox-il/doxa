  title: ואפשר להבין אותך.
  accent: ''
  body: |-
    אחרי שנים בזוגיות, אתה חוזר לעולם הדייטים. פתאום יש הודעות, אפליקציות, נשים חדשות וכללים שאתה כבר לא בטוח שאתה מכיר.
    ואז מגיעה מישהי שמוצאת חן בעיניך, ומשהו אצלך משתנה.
