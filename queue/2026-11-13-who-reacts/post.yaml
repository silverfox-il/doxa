  kicker: ''
  title: וכשאתה באמת נמצא במקום הזה, היא זו שמתחילה להתאמץ.
  accent: ''
  body: היא מספרת לך על עצמה, מנסה להצחיק אותך, בודקת אם אתה מתעניין.
