  title: תחשוב על לקוח שנכנס לחנות רהיטים.
  accent: ''
  body: הוא הולך בין הספות, מסתכל, נוגע בבד, לא מתלהב במיוחד. בינתיים המוכר רץ אחריו, מספר לו על הריפוד, על המבצע.
  layout: bottom
