  title: אם אתה חוזר הביתה ומנתח כל מילה ששלחה או אמרה, אתה ריאקטיבי.
  accent: ''
  body: המטרה היא הפוכה. אתה רוצה להיות הגבר שהיא מגיבה אליו. שהמשפט שלך משנה לה את מצב הרוח, ולא ההפך.
  layout: bottom
